[project]
name = "qsim"
version = "0.1.0"
description = "A drifting transmon device model with an explicit measurement cost model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
gui = [
    "marimo>=0.24.2,<0.25",
    "matplotlib>=3.11.2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsim"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["calibration"]   # vendored project with its own tooling; HANDOFF says do not edit

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",     # long lines: physics comments carry equations that do not wrap well
    "UP042",    # Routine is deliberately str+Enum, not StrEnum: the str value is the wire format
    "SIM108",   # ternaries are not clearer than if/else in the numeric paths
]

[tool.ruff.lint.per-file-ignores]
"gui/app.py" = ["B018"]   # a marimo cell displays its last bare expression

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gui"]
